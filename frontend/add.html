<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Details - Personal Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="glass-container">
        <div class="header-with-back">
            <button class="btn-icon" onclick="window.location.href='index.html'" title="Go Back">
                <span>←</span>
            </button>
            <h2>Add Personal Details</h2>
        </div>
        
        <form id="personForm" class="modern-form">
            <div class="input-group">
                <label for="name">Full Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="name" placeholder="e.g. John Doe" required>
                </div>
            </div>
            
            <div class="input-group">
                <label for="age">Age</label>
                <div class="input-wrapper">
                    <span class="input-icon">🎂</span>
                    <input type="number" id="age" placeholder="e.g. 28" required>
                </div>
            </div>
            
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" placeholder="e.g. john@example.com" required>
                </div>
            </div>
            
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <span class="input-icon">📞</span>
                    <input type="text" id="phone" placeholder="e.g. +1 234 567 890" required>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary glow-effect w-full">
                    <span>Save Details</span>
                </button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
